<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرب مجاني 100%</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px;max-width:600px;margin:auto}
input,textarea{width:100%;background:#111;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;margin:8px 0}
button{width:100%;background:#d4af37;color:#000;border:none;border-radius:12px;padding:16px;font-weight:800;font-size:18px}
#log{background:#000;color:#0f0;padding:10px;border-radius:8px;white-space:pre-wrap;min-height:50px;margin-top:10px}</style>
</head><body>
<h2>🎵 طرب - مجاني 100% بدون رصيد</h2>
<p style="color:#0f0">✅ هذا يشتغل مجانا - ما يحتاج 0.044$</p>
<input id="hf" type="password" placeholder="مفتاح HuggingFace المجاني hf_...">
<textarea id="txt" rows="3">حبيبي هيمان وينك من زمان - أغنية خليجية حزينة عود</textarea>
<button onclick="genFree()">ولّد مجانا (بدون فلوس)</button>
<div id="log">الصق مفتاح HuggingFace المجاني...</div>
<div id="player"></div>
<script>
async function genFree(){
let key=document.getElementById('hf').value.trim();
let txt=document.getElementById('txt').value;
let L=document.getElementById('log');
L.textContent='جاري التوليد المجاني... قد يأخذ دقيقة أول مرة...';
try{
let r=await fetch('https://api-inference.huggingface.co/models/facebook/musicgen-stereo-small',{
method:'POST',
headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
body:JSON.stringify({inputs:txt})
});
if(!r.ok){let t=await r.text();L.textContent='خطأ: '+t+'\nتأكد المفتاح يبدأ بـ hf_';return;}
let blob=await r.blob();
let url=URL.createObjectURL(blob);
L.textContent='✅ اكتملت!';
document.getElementById('player').innerHTML='<audio controls autoplay src="'+url+'" style="width:100%"></audio><br><a href="'+url+'" download style="color:#d4af37">⬇️ تحميل MP3 مجانا</a>';
}catch(e){L.textContent='خطأ: '+e.message+' - شغل VPN';}
}
</script>
</body></html>
